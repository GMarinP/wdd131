<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="This is the page for a product review form that leads to a thank you page when completed. ">
        <meta name="author" content="Giovanna Marin Pereira">
        <link rel="stylesheet" href="styles/form.css">
        <script src="scripts/form.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <title>Product Review Form</title>
    </head>
    <body>
        <header>
            <h1>Product Review</h1>
        </header>
        <main>
            <form method="get" action="review.html" class="form">
                <fieldset>
                    <label>Product Name* 
                        <select name="product" id="product_name" required>
                            <option value="" disabled selected>Select a Product... </option>
                        </select>
                    </label>    

                    <div>Overall Rating*</div>
                    <label><input type="radio" name="rating" value="1" id="rating" required>&star;</label>
                    <label><input type="radio" name="rating" value="2" id="rating" required>&star;&star;</label>
                    <label><input type="radio" name="rating" value="3" id="rating" required>&star;&star;&star;</label>
                    <label><input type="radio" name="rating" value="4" id="rating" required>&star;&star;&star;&star;</label>
                    <label><input type="radio" name="rating" value="5" id="rating" required>&star;&star;&star;&star;&star;</label>
                    

                    <label>Date of Installation* <input type="date" name="installationDate" id="date" required></label>
                    
                    <div>Which features did you find useful in the product?</div>
                    <label><input type="checkbox" name="design" value="yes">Design</label>
                    <label><input type="checkbox" name="durability" value="yes">Durability</label>
                    <label><input type="checkbox" name="ease" value="yes">Ease of use</label>
                    <label><input type="checkbox" name="performance" value="yes">Performance</label>
                    

                    <label>Written Review<textarea id="review" name="review"></textarea></label>
                    

                    <label>Your Name<input type="text" name="fname" id="userName"></label>
                
                    <input type="submit" value="Post Review">
                </fieldset>
            </form>   
        </main>
        <footer>
            <p>©<span id="currentYear"></span>&nbsp;| Giovanna Marin Pereira | Italy</p>
            <br>
            <p id="lastModified"></p>
        </footer>
    </body>
</html>
