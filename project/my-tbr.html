        <link rel="preconnect" href="https://fonts.googleapis.com">

        <header>
            <h1>the bookshelf</h1>
            <button type="button" id="menu" aria-label="Menu"></button>
            <nav class="navigation">
                <a href="bookshelf.html">Home</a>

                <a href="my-shelf.html">My Shelf</a>
                <a href="my-tbr.html">My TBR</a>
            </nav>
        </header>
        <main>
            <h1>my tbr</h1>
            <p>Don't know what to read next? When you add your TBR list to our program, it can randomly select your next read. Just simply type the names of the books you want to read and let the website choose for you. </p>
            <section class="tbr">
                <div class="input">
                    <label for="wantToRead">Enter Book: </label>
                    <input type="text" id="wantToRead" placeholder="Romeo and Juliet">
                    <button type="submit" id="addButton">Add book</button>
                </div>
                <ul id="list"></ul>
            </section>
            <section class="randomizer">
                <button type="submit" id="randomButton">Random book</button>
                <span id="randomBookText"></span>
            </section>
        </main>
        <footer>
            <p>©<span id="currentYear"></span>&nbsp;| Giovanna Marin Pereira | Italy</p>
            <br>
            <p id="lastModified"></p>
        </footer>
